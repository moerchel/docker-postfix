services:

  postfix:
    image: ghcr.io/moerchel/docker-postfix:latest
    container_name: postfix
    # All variables from .env (see .env.example) are passed to the container
    env_file: .env
    ports:
      # Only bind to the address the clients use. Binding to all interfaces
      # can turn the container into an open relay (see README).
      - '${POSTFIX_BIND_ADDRESS:-127.0.0.1}:${POSTFIX_HOST_PORT:-2525}:25'
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./secrets/:/secrets/:ro
      # Keep queued mails when the container is recreated
      - postfix-spool:/var/spool/postfix
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    restart: unless-stopped

volumes:
  postfix-spool:
