name: Docker

on:
  # Rebuild every 3 days, to pick up security fixes soon. A release is only
  # created if Alpine packages changed. "*/3" is the 1st, 4th, 7th, ... 31st
  # of the month, so at the turn of the month the gap is 1 to 3 days.
  schedule:
    - cron: '17 4 */3 * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    # Changes that don't affect the image don't trigger a build/release
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docker-compose/**'
      - '.github/dependabot.yml'
    # Manually pushed tags (e.g. 20260416, v1.2.3) are published as image tags
    tags: [ '2*', 'v*.*.*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

# No permissions by default, each job requests what it needs
permissions: {}

# One run per branch at a time; only superseded PR runs are cancelled,
# a running publish on main is never interrupted
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck
        run: shellcheck run.sh .github/scripts/*.sh

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Upload of Trivy results to the Security tab
      security-events: write
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.prepare.outputs.version }}
      title: ${{ steps.prepare.outputs.title }}
      notes: ${{ steps.prepare.outputs.notes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login against a Docker registry except on PR
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release version YYYYMMDD (YYYYMMDD.1, .2, ... for further releases on
      # the same day). Only on main, where releases are created.
      - name: Release version
        id: version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(date -u +%Y%m%d); version=$base; n=0
          while gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$version" >/dev/null 2>&1; do
            n=$((n + 1)); version="$base.$n"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Extract metadata (tags, labels) for Docker. The tags are only set
      # after the tests, see "Publish the tested image".
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=sha

      # The multi-arch image is built exactly once. Outside of PRs it is
      # pushed by digest, without a tag, so the image that is tested and
      # scanned below is exactly the one that gets published. PRs only build
      # (Dependabot PRs may not push).
      # Scheduled builds skip the cache so "apk upgrade" really fetches updates.
      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Supply chain attestations
          provenance: mode=max
          sbom: true

      # The amd64 image for the tests: outside of PRs the pushed image itself,
      # in PRs a build from the cache of the step above
      - name: Pull the built amd64 image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull -q --platform linux/amd64 "$IMAGE"
          docker tag "$IMAGE" docker-postfix:scan

      - name: Load the built amd64 image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: docker-postfix:scan
          cache-from: type=gha

      # Relays test mails through the image to smtp-sink: health check,
      # "postfix check", SASL with SMTP_PASSWORD_FILE, no password in the
      # DEBUG log, no mail without TLS by default
      - name: Smoke test
        run: .github/scripts/smoke-test.sh docker-postfix:scan

      # Report all known vulnerabilities to the repository's Security tab
      - name: Trivy scan (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: docker-postfix:scan
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Upload Trivy results to GitHub Security tab
        # Skipped if an earlier step failed before Trivy wrote the file
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # Fail the build (and don't publish) on HIGH/CRITICAL vulnerabilities
      # that already have a fix available
      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: true
        with:
          image-ref: docker-postfix:scan
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'

      # Digests of the ARM images in the pushed image index, so Trivy scans
      # exactly these manifests
      - name: Find the ARM image digests
        id: platforms
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          index=$(docker buildx imagetools inspect --raw "$IMAGE")
          for p in arm64:arm64: armv7:arm:v7; do
            IFS=: read -r key arch variant <<<"$p"
            digest=$(jq -er --arg a "$arch" --arg v "$variant" \
              '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a and (.platform.variant // "") == $v)] | if length == 1 then .[0].digest else error("not exactly one manifest") end' <<<"$index")
            echo "linux/$arch${variant:+/$variant}: $digest"
            echo "$key=$digest" >> "$GITHUB_OUTPUT"
          done

      # The same gate for the ARM images, scanned directly in the registry
      # (they exist there only outside of PRs)
      - name: Trivy scan (gate, linux/arm64)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_IMAGE_SRC: remote
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.platforms.outputs.arm64 }}
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Trivy scan (gate, linux/arm/v7)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_IMAGE_SRC: remote
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.platforms.outputs.armv7 }}
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'

      # Compare the installed packages with the currently published image and
      # decide whether to publish and to create a release:
      #   push to main / manual run on main -> publish + release
      #   scheduled build                   -> publish + release only if packages changed
      #   pushed tag                        -> publish (image tag = git tag), no release
      - name: Compare packages with published image
        id: decide
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          PUBLISHED: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          docker run --rm --entrypoint apk docker-postfix:scan info -v | sort > new.txt
          if docker pull -q --platform linux/amd64 "$PUBLISHED" >/dev/null 2>&1; then
            docker run --rm --platform linux/amd64 --entrypoint apk "$PUBLISHED" info -v | sort > old.txt
          else
            : > old.txt
          fi

          # apk lists "name-version-rN"; build a table of changed packages
          declare -A old new
          while read -r l; do n=${l%-*-*}; old[$n]=${l#"$n"-}; done < old.txt
          while read -r l; do n=${l%-*-*}; new[$n]=${l#"$n"-}; done < new.txt
          for n in $(printf '%s\n' "${!old[@]}" "${!new[@]}" | sort -u); do
            o=${old[$n]:-}; v=${new[$n]:-}
            if [ "$o" != "$v" ]; then echo "| $n | ${o:--} | ${v:--} |"; fi
          done > changes.md

          changed=false
          if [ -s changes.md ]; then changed=true; fi
          on_main=false
          if [ "$REF" = "refs/heads/main" ]; then on_main=true; fi
          case "$EVENT" in
            schedule) publish=$changed; release=$changed ;;
            *)        publish=true;     release=$on_main ;;
          esac
          echo "Packages changed: $changed, publish: $publish, release: $release"
          cat changes.md
          {
            echo "changed=$changed"
            echo "publish=$publish"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

      # Release notes
      - name: Prepare release
        id: prepare
        if: steps.decide.outputs.release == 'true'
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ steps.decide.outputs.changed }}
          version: ${{ steps.version.outputs.version }}
        run: |
          alpine=$(docker run --rm --entrypoint cat docker-postfix:scan /etc/alpine-release)
          postfix=$(docker run --rm --entrypoint postconf docker-postfix:scan -h mail_version)
          title="$version"
          if [ "$EVENT" = "schedule" ]; then title="$version - Alpine package updates"; fi

          {
            echo "## Image"
            echo
            echo '```'
            echo "docker pull $IMAGE:$version"
            echo '```'
            echo
            echo "Also published as \`latest\` and \`main\`. Alpine $alpine, Postfix $postfix."
            if [ "$CHANGED" = "true" ]; then
              echo
              echo "## Updated packages"
              echo
              echo "| Package | Previous | New |"
              echo "|---|---|---|"
              cat changes.md
            fi
          } > notes.md

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<EOF_RELEASE_NOTES"
            cat notes.md
            echo "EOF_RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"

      # Sets the tags on the tested image. No new build: the tags point to
      # the image index pushed by digest above, which is checked afterwards.
      - name: Publish the tested image
        if: steps.decide.outputs.publish == 'true'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while read -r tag; do
            if [ -n "$tag" ]; then args+=(-t "$tag"); fi
          done <<<"$TAGS"
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"

          while read -r tag; do
            if [ -z "$tag" ]; then continue; fi
            got=sha256:$(docker buildx imagetools inspect --raw "$tag" | sha256sum | cut -d' ' -f1)
            echo "$tag -> $got"
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::$tag doesn't point to the tested image $DIGEST"
              exit 1
            fi
          done <<<"$TAGS"

  # Git tag + GitHub release for the published image. Tags and releases
  # created with the GITHUB_TOKEN don't trigger another workflow run.
  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TITLE: ${{ needs.build.outputs.title }}
          NOTES: ${{ needs.build.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > notes.md
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TITLE" --notes-file notes.md --generate-notes
